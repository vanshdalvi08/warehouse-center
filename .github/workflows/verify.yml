name: Verify Warehouse Center
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: warehouse_demo
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: warehouse_center_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U warehouse_demo -d warehouse_center_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/warehouse_center_test
          TEST_DB_USER: warehouse_demo
          TEST_DB_PASSWORD: ci-only-test-password
          DEBUG: 'false'
        run: chmod +x mvnw && ./mvnw -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: npm ci && npm test && npm run build
