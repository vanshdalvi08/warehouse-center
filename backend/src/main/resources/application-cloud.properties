server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
# Provision this private schema before starting the hosted app.
# Keep it out of Supabase's exposed Data API schemas.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:warehouse}
app.security.enabled=true
app.security.username=${APP_USERNAME:operator}
app.security.password=${APP_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.error.include-message=never
