services:
  - type: web
    name: warehouse-center-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_SCHEMA
        value: warehouse
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
